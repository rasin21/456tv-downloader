<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>456tv 전용 브라우저 · 로그인</title>
<link rel="icon" href="/icon.png">
<style>
  :root { --bg:#141415; --card:#19191b; --raised:#232325; --line:rgba(237,237,237,.08); --text:#ededed; --text2:#a1a1a6;
    --muted:#85858b; --brand:#C8B6FF; --ok:#4cc38a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 14px/20px "Pretendard Variable",Pretendard,"Malgun Gothic",system-ui,sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 24px; }
  h1 { display:flex; align-items:center; gap:8px; font-size: 20px; line-height: 28px; font-weight: 500; margin: 0 0 8px; }
  h1 b { background:var(--brand); color:#0B0A10; border-radius:6px; padding:2px 6px; font-size: 15px; font-weight: 600; }
  p { color: var(--text2); margin: 0 0 24px; line-height: 22px; }
  .list { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  a.site { display:flex; align-items:center; gap:12px; min-height:60px; padding:12px 16px; color:var(--text); text-decoration:none;
    border-top:1px solid var(--line); transition: background-color 150ms cubic-bezier(.22,1,.36,1); }
  a.site:first-child { border-top:0; }
  a.site:hover { background: var(--raised); }
  a.site small { color: var(--muted); display:block; font-size:12px; line-height:16px; margin-top:2px; }
  .st { margin-left:auto; display:inline-flex; align-items:center; gap:8px; font-size:12px; color:var(--text2); white-space:nowrap; }
  .dot { width:6px; height:6px; border-radius:50%; box-shadow: inset 0 0 0 1px var(--muted); }
  .st.on .dot { background: var(--ok); box-shadow:none; }
  .note { margin-top: 24px; font-size: 12px; line-height: 20px; color: var(--muted); }
  code { font: 12px ui-monospace, Consolas, monospace; color: var(--text2); }
</style>
</head>
<body>
<div class="wrap">
  <h1><b>456tv</b>전용 브라우저</h1>
  <p>평소 쓰는 크롬과 분리된 창이에요. 로그인이 필요한 사이트만 아래에서 열어 한 번 로그인해 두면, 다운로더가 그 로그인 정보로 받아옵니다.</p>
  <div class="list" id="list"></div>
  <div class="note">
    · 가능하면 <b>부계정</b>으로 로그인하세요. 너무 많이 받으면 사이트가 계정을 일시 제한할 수 있어요.<br>
    · 로그인 정보는 이 PC의 <code>456tv-downloader\data</code> 폴더에만 저장되고, 밖으로 보내지 않습니다.<br>
    · 더우인은 로그인하지 않아도 <b>한 번 열어 두기만</b> 하면 성공률이 올라가요.
  </div>
</div>
<script>
const SITES = [
  ["instagram", "인스타그램", "https://www.instagram.com/accounts/login/", "릴스·사진 게시물"],
  ["threads", "스레드", "https://www.threads.com/login", "영상·사진 게시물"],
  ["tiktok", "틱톡", "https://www.tiktok.com/login", "연령 제한·사진 게시물"],
  ["douyin", "더우인", "https://www.douyin.com/", "중국 틱톡 · 열어 두기만 해도 도움"],
  ["xiaohongshu", "샤오홍슈(RedNote)", "https://www.xiaohongshu.com/explore", "로그인해야 볼 수 있어요"],
  ["naver", "네이버", "https://nid.naver.com/nidlogin.login", "클립·TV (보통은 로그인 없이 됨)"],
];
function render(login) {
  document.getElementById("list").innerHTML = SITES.map(([k, n, u, d]) =>
    `<a class="site" href="${u}" target="_blank"><div>${n}<small>${d}</small></div>
     <span class="st ${login[k] ? "on" : ""}"><span class="dot"></span>${login[k] ? "로그인됨" : "로그인하기"}</span></a>`).join("");
}
async function poll() {
  try { render((await (await fetch("/api/login-status")).json()).login); } catch {}
}
render({}); poll(); setInterval(poll, 4000);
</script>
</body>
</html>
